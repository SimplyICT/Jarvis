<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<style>
  :root {
    --bg: #05070d;
    --panel: #0d1220;
    --panel-2: #131a2c;
    --line: #1e2942;
    --text: #e6ecf7;
    --muted: #7d8bab;
    --accent: #35d1ff;
    --accent-dim: #1b6d8a;
    --good: #3ddc97;
    --warn: #ffb454;
    --bad: #ff5f6d;
    --gold: #ffc857;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Everything is one column: header, transcript, composer. */
  .app {
    display: flex; flex-direction: column;
    height: 100%; max-width: 900px; margin: 0 auto;
    padding: 18px 18px 14px;
  }

  /* ---------- header ---------- */

  header {
    display: flex; align-items: center; gap: 14px;
    padding-bottom: 14px; border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }

  .orb {
    width: 42px; height: 42px; border-radius: 50%;
    background: radial-gradient(circle at 34% 32%, #6fe6ff, var(--accent-dim) 58%, #0a2b3a);
    box-shadow: 0 0 0 1px #1d5c74, 0 0 22px -4px var(--accent);
    flex: 0 0 auto;
    transition: box-shadow .2s, filter .2s;
  }
  .orb.working { animation: pulse 1.15s ease-in-out infinite; }
  .orb.listening { box-shadow: 0 0 0 1px #1d5c74, 0 0 34px 2px var(--accent); filter: brightness(1.25); }
  .orb.speaking { box-shadow: 0 0 0 1px #6b5a1d, 0 0 30px 0px var(--gold); filter: hue-rotate(-24deg) brightness(1.1); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 1px #1d5c74, 0 0 20px -6px var(--accent); }
    50%      { box-shadow: 0 0 0 1px #1d5c74, 0 0 34px 3px var(--accent); }
  }

  .titles { flex: 1 1 220px; min-width: 0; }
  .titles h1 {
    margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .13em;
    text-transform: uppercase;
  }
  .titles .sub {
    font-size: 12px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ---------- toggles ---------- */

  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  button {
    font: inherit; color: var(--text); cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 12px;
    transition: border-color .15s, background .15s, color .15s;
  }
  button:hover:not(:disabled) { border-color: var(--accent-dim); background: #172134; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* The "ear" and "focus" toggles mirror his EARS / FOCUS buttons. */
  button.toggle { min-width: 84px; }
  button.toggle[aria-pressed="true"] {
    border-color: var(--accent); color: var(--accent);
    background: #0c2534; box-shadow: inset 0 0 14px -6px var(--accent);
  }
  button.toggle[aria-pressed="true"].gold {
    border-color: var(--gold); color: var(--gold);
    background: #2a2211; box-shadow: inset 0 0 14px -6px var(--gold);
  }

  /* Speech unavailable in this browser — still clickable, so it can explain. */
  button.unsupported {
    border-style: dashed;
    border-color: var(--warn);
    color: var(--warn);
  }

  /* ---------- transcript ---------- */

  .transcript {
    flex: 1 1 auto; overflow-y: auto; padding: 18px 4px 8px;
    display: flex; flex-direction: column; gap: 14px;
    scrollbar-width: thin;
  }
  .transcript::-webkit-scrollbar { width: 9px; }
  .transcript::-webkit-scrollbar-thumb { background: #1c2740; border-radius: 9px; }

  .turn { display: flex; flex-direction: column; gap: 4px; max-width: 88%; }
  .turn .who {
    font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted);
  }
  .turn .what { white-space: pre-wrap; word-wrap: break-word; }

  .turn.you { align-self: flex-end; align-items: flex-end; }
  .turn.you .what {
    background: #16233c; border: 1px solid #24365a;
    border-radius: 13px 13px 3px 13px; padding: 9px 13px;
  }

  .turn.jarvis .who { color: var(--accent); }
  .turn.jarvis .what {
    background: var(--panel); border: 1px solid var(--line);
    border-left: 2px solid var(--accent-dim);
    border-radius: 3px 13px 13px 13px; padding: 11px 14px;
  }
  .turn.jarvis.error .what { border-left-color: var(--bad); color: #ffd8dc; }

  .meta {
    font-size: 11px; color: var(--muted);
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .meta .grounded { color: var(--good); }

  /* Typing indicator while the agent works. */
  .dots { display: inline-flex; gap: 4px; padding: 4px 0; }
  .dots i {
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    animation: bounce 1.25s infinite ease-in-out;
  }
  .dots i:nth-child(2) { animation-delay: .16s; }
  .dots i:nth-child(3) { animation-delay: .32s; }
  @keyframes bounce {
    0%, 60%, 100% { opacity: .28; transform: translateY(0); }
    30%           { opacity: 1;   transform: translateY(-4px); }
  }

  /* ---------- memory drawer ---------- */

  .memory {
    border-top: 1px solid var(--line);
    max-height: 0; overflow: hidden;
    transition: max-height .25s ease;
  }
  .memory.open { max-height: 320px; overflow-y: auto; }
  .memory-inner { padding: 12px 2px 4px; }
  .memory h2 {
    margin: 0 0 8px; font-size: 11px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--muted); font-weight: 600;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
  .chip {
    font-size: 12px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 10px; color: var(--muted);
  }
  .chip b { color: var(--text); font-weight: 600; }
  pre.out {
    margin: 0; font: 12px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
    color: var(--muted); white-space: pre-wrap; word-break: break-word;
  }

  /* ---------- voice chooser ---------- */

  .note {
    margin: 0 0 10px; font-size: 12px; color: var(--muted); line-height: 1.5;
  }

  .ratelabel {
    font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 7px;
  }
  .ratelabel output { color: var(--text); font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 130px; accent-color: var(--accent); }

  .voicelist {
    display: flex; flex-direction: column; gap: 5px; max-height: 210px;
    overflow-y: auto; padding-right: 4px;
  }
  .voicerow {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 12px; text-align: left; width: 100%;
    padding: 7px 11px; border-radius: 8px;
  }
  .voicerow .vname { font-size: 13px; }
  .voicerow .vmeta {
    font-size: 11px; color: var(--muted); white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .voicerow.chosen {
    border-color: var(--accent); background: #0c2534;
    box-shadow: inset 0 0 14px -8px var(--accent);
  }
  .voicerow.chosen .vname { color: var(--accent); font-weight: 600; }
  .voicerow.chosen .vmeta::after { content: "  ✓"; color: var(--accent); }

  .enginebar { display: flex; gap: 7px; margin-bottom: 10px; flex-wrap: wrap; }
  .enginebar button { font-size: 12px; padding: 5px 11px; border-radius: 999px; }
  .enginebar button[aria-pressed="true"] {
    border-color: var(--accent); color: var(--accent); background: #0c2534;
  }
  .enginebar button:disabled { opacity: .4; cursor: not-allowed; }

  /* Treatment chooser sits under the engine row, same visual language. */
  .treatedbar {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px;
  }
  .treatedbar button { font-size: 12px; padding: 5px 11px; border-radius: 999px; }
  .treatedbar button[aria-pressed="true"] {
    border-color: var(--gold); color: var(--gold); background: #2a2211;
  }
  .treatedbar button:disabled { opacity: .35; cursor: not-allowed; }
  .treatedbar .tlabel {
    font-size: 11px; color: var(--muted); align-self: center;
    letter-spacing: .1em; text-transform: uppercase; margin-right: 2px;
  }

  /* ---------- composer ---------- */

  .composer {
    display: flex; gap: 9px; padding-top: 12px;
    border-top: 1px solid var(--line); align-items: flex-end;
  }
  textarea {
    flex: 1 1 auto; resize: none; min-height: 44px; max-height: 160px;
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 11px; padding: 11px 13px;
  }
  textarea:focus { outline: none; border-color: var(--accent-dim); }
  textarea::placeholder { color: #5a6684; }

  .send {
    background: var(--accent-dim); border-color: #2b93b8; color: #eafaff;
    font-weight: 600; padding: 11px 20px;
  }
  .send:hover:not(:disabled) { background: #23809f; }

  .hint {
    font-size: 11px; color: var(--muted); padding-top: 7px; text-align: center;
  }
  kbd {
    font: 11px ui-monospace, Consolas, monospace; background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px;
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="orb" id="orb" aria-hidden="true"></div>
    <div class="titles">
      <h1>Jarvis</h1>
      <div class="sub" id="sub">Connecting…</div>
    </div>
    <div class="controls">
      <button class="toggle" id="ear" aria-pressed="false" title="Hands-free: say “Jarvis” to wake">
        Ear off
      </button>
      <button class="toggle" id="voice" aria-pressed="true" title="Speak answers aloud">
        Voice on
      </button>
      <button class="toggle" id="voiceBtn" aria-pressed="false" title="Choose JARVIS's voice">
        Voice
      </button>
      <button class="toggle" id="memoryBtn" aria-pressed="false" title="Show the second brain">
        Memory
      </button>
    </div>
  </header>

  <main class="transcript" id="transcript"></main>

  <section class="memory" id="voicePanel">
    <div class="memory-inner">
      <h2>Voice</h2>
      <p class="note" id="voiceHint"></p>
      <div class="controls" style="margin-bottom:10px; align-items:center">
        <button id="testVoice">Test voice</button>
        <button id="reloadVoices">Reload voices</button>
        <label class="ratelabel" for="rate">Rate <output id="rateOut">1.00</output></label>
        <input type="range" id="rate" min="0.6" max="1.6" step="0.05" value="1">
      </div>
      <div class="enginebar" id="engineBar"></div>
      <div class="treatedbar" id="treatedBar"></div>
      <div class="voicelist" id="voiceList"></div>
    </div>
  </section>

  <section class="memory" id="memory">
    <div class="memory-inner">
      <h2>Second brain</h2>
      <div class="chips" id="memoryChips"></div>
      <div class="controls" style="margin-bottom:10px">
        <button id="rebuild">Rebuild index</button>
        <button id="showStats">Stats</button>
        <button id="diagnose">Diagnostics</button>
      </div>
      <pre class="out" id="memoryOut">Memory controls appear here.</pre>
    </div>
  </section>

  <div class="composer">
    <textarea id="input" rows="1" placeholder="Type a request, or turn the ear on and say “Jarvis …”"></textarea>
    <button class="send" id="send">Send</button>
  </div>
  <div class="hint">
    <kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line
  </div>

</div>

<script>
"use strict";

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------

const state = {
  ear: false,          // hands-free listening (the "ear")
  voice: true,         // speak answers aloud
  rate: 1.0,           // speech rate; persisted in localStorage
  busy: false,         // a job is in flight
  listening: false,
  speaking: false,
  wake: /\b(jarvis|jarvos|jervis|jarvis')\b/i,
  poll: null,
  recognition: null,
  status: null,
  // Speech output. "neural" means server-rendered edge-tts audio; "browser"
  // means the platform synthesiser. Neural is preferred when installed, but
  // the choice is the user's and is remembered.
  ttsEngine: "neural",
  neuralVoice: "en-GB-RyanNeural",
  // The chosen sound treatment, picked by ear from scripts/audition_effects.py.
  treatment: "movie",
  audio: null,
};

// Restore the chosen engine, rate, voice and treatment; resolved lazily.
try {
  const savedRate = parseFloat(localStorage.getItem("jarvis.rate") || "");
  if (savedRate >= 0.6 && savedRate <= 1.6) state.rate = savedRate;

  const savedEngine = localStorage.getItem("jarvis.ttsEngine");
  if (savedEngine === "browser" || savedEngine === "neural") state.ttsEngine = savedEngine;

  const savedVoice = localStorage.getItem("jarvis.neuralVoice");
  if (savedVoice) state.neuralVoice = savedVoice;

  const savedTreatment = localStorage.getItem("jarvis.treatment");
  if (savedTreatment) state.treatment = savedTreatment;
} catch { /* private mode: keep the defaults */ }

const WAKE_STRIP = /^\s*(hey\s+)?jarvis[\s,.:;!?-]*/i;

const el = {
  orb: document.getElementById("orb"),
  sub: document.getElementById("sub"),
  ear: document.getElementById("ear"),
  voice: document.getElementById("voice"),
  memoryBtn: document.getElementById("memoryBtn"),
  memory: document.getElementById("memory"),
  memoryChips: document.getElementById("memoryChips"),
  memoryOut: document.getElementById("memoryOut"),
  rebuild: document.getElementById("rebuild"),
  showStats: document.getElementById("showStats"),
  diagnose: document.getElementById("diagnose"),
  voiceList: document.getElementById("voiceList"),
  reloadVoices: document.getElementById("reloadVoices"),
  rate: document.getElementById("rate"),
  rateOut: document.getElementById("rateOut"),
  testVoice: document.getElementById("testVoice"),
  engineBar: document.getElementById("engineBar"),
  treatedBar: document.getElementById("treatedBar"),
  voiceBtn: document.getElementById("voiceBtn"),
  voicePanel: document.getElementById("voicePanel"),
  voiceHint: document.getElementById("voiceHint"),
  transcript: document.getElementById("transcript"),
  input: document.getElementById("input"),
  send: document.getElementById("send"),
};

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------

function setOrb(mode) {
  el.orb.className = "orb" + (mode ? " " + mode : "");
}

function addTurn(who, text, opts = {}) {
  const turn = document.createElement("div");
  turn.className = "turn " + who + (opts.error ? " error" : "");

  const label = document.createElement("div");
  label.className = "who";
  label.textContent = who === "you" ? "You" : "Jarvis";
  turn.appendChild(label);

  const what = document.createElement("div");
  what.className = "what";
  what.textContent = text;
  turn.appendChild(what);

  if (opts.meta) {
    const meta = document.createElement("div");
    meta.className = "meta";
    for (const [text2, cls] of opts.meta) {
      const span = document.createElement("span");
      if (cls) span.className = cls;
      span.textContent = text2;
      meta.appendChild(span);
    }
    turn.appendChild(meta);
  }

  el.transcript.appendChild(turn);
  el.transcript.scrollTop = el.transcript.scrollHeight;
  return { turn, what };
}

function addWorking() {
  const { turn, what } = addTurn("jarvis", "");
  const dots = document.createElement("span");
  dots.className = "dots";
  dots.innerHTML = "<i></i><i></i><i></i>";
  what.appendChild(dots);
  el.transcript.scrollTop = el.transcript.scrollHeight;
  return turn;
}

function renderStatus() {
  const s = state.status;
  if (!s) { el.sub.textContent = "Offline"; return; }

  const parts = [];
  if (s.brain.indexed) {
    parts.push(`${s.brain.notes} notes · ${s.brain.folders} groups`);
  } else if (s.brain.configured) {
    parts.push("brain not indexed");
  } else {
    parts.push("no memory vault");
  }
  parts.push(s.runner.dsh ? `agent ready (${s.profile})` : "agent not found");
  el.sub.textContent = parts.join("  ·  ");

  const chips = [
    ["status", s.runner.dsh ? "agent ready" : "agent missing"],
    ["vault", s.brain.vault || "unset"],
    ["notes", String(s.brain.notes ?? "—")],
    ["groups", String(s.brain.folders ?? "—")],
    ["indexed", s.brain.built ? s.brain.built.slice(0, 19).replace("T", " ") : "never"],
  ];
  el.memoryChips.innerHTML = chips
    .map(([k, v]) => `<span class="chip">${k} <b>${escapeHtml(v)}</b></span>`)
    .join("");
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

// ---------------------------------------------------------------------------
// API
// ---------------------------------------------------------------------------

async function api(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
  return await response.json();
}

async function refreshStatus() {
  try {
    state.status = await api("/api/status");
    renderStatus();
  } catch {
    el.sub.textContent = "Jarvis server unreachable";
  }
}

// ---------------------------------------------------------------------------
// Speaking
// ---------------------------------------------------------------------------

/**
 * Turn a markdown answer into something worth hearing.
 *
 * Left raw, the synthesiser reads "asterisk asterisk dollar two thousand five
 * hundred asterisk asterisk" and announces the contents of every URL. This
 * strips everything that only makes sense on a page.
 */
function speakable(text) {
  return String(text)
    // Code blocks and inline code: drop the code, keep any prose around it.
    .replace(/```[\s\S]*?```/g, " ")
    .replace(/`([^`]*)`/g, "$1")
    // Markdown links and bare urls: speak the label, never the address.
    .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
    .replace(/https?:\/\/\S+/g, "a link")
    // Paths like 00-business/rate-card.md read terribly out loud.
    .replace(/\b[\w.-]+(?:\/[\w.-]+)+\.\w{2,4}\b/g, "a note")
    // Structure markers.
    .replace(/^\s{0,3}#{1,6}\s+/gm, "")
    .replace(/^\s*[-*+]\s+/gm, "")
    .replace(/^\s*>\s?/gm, "")
    .replace(/^\s*\|.*\|\s*$/gm, " ")      // table rows
    .replace(/^\s*[-:| ]{3,}\s*$/gm, " ")  // table rules
    // Source citations are useful on screen and unbearable aloud. The agent
    // ends almost every answer with one, so a bare "a note" tail reads as a
    // stutter; drop the whole clause instead.
    .replace(/[\s,;—–-]*\b(?:per|from|see|source:?|according to)\s+a note\.?/gi, ". ")
    .replace(/^\s*(?:related|sources?)\s*:?\s*$/gim, "")
    // Emphasis and leftovers.
    .replace(/\*\*([^*]+)\*\*/g, "$1")
    .replace(/\*([^*]+)\*/g, "$1")
    .replace(/__([^_]+)__/g, "$1")
    .replace(/[_~]/g, " ")
    // Currency reads better spelled out at speed.
    .replace(/\$\s?([\d,]+(?:\.\d{2})?)/g, "$1 dollars")
    .replace(/&/g, " and ")
    .replace(/[ \t]+/g, " ")
    .replace(/\n{2,}/g, ". ")
    // Removing a citation tail can strand a second full stop.
    .replace(/\.(\s*\.)+/g, ".")
    .replace(/\s+([.,;:!?])/g, "$1")
    .trim();
}

/**
 * Score a voice for the JARVIS register: a British male, and a neural one if
 * the browser has it. Anything is better than the Windows default, so the
 * scale is generous at the bottom.
 */
function scoreVoice(voice) {
  let score = 0;
  const name = (voice.name || "").toLowerCase();
  const lang = (voice.lang || "").toLowerCase().replace("_", "-");

  // Locale: British first (JARVIS is a British butler), then other English.
  if (lang.startsWith("en-gb")) score += 100;
  else if (lang.startsWith("en-au")) score += 80;
  else if (lang.startsWith("en")) score += 30;

  // Quality tier. "Natural"/"Neural" voices are in a different league.
  if (/natural|neural|online|premium|enhanced/.test(name)) score += 60;
  if (/multilingual/.test(name)) score += 5;

  // Male-presenting names, including Microsoft's and Google's.
  const male = ["ryan", "thomas", "george", "oliver", "arthur", "daniel", "james",
                "guy", "david", "mark", "male", "liam", "william", "brian",
                "christopher", "eric", "roger", "steffan", "alex"];
  const female = ["sonia", "libby", "hazel", "zira", "female", "aria", "jenny",
                  "michelle", "emma", "clara", "natasha", "maisie", "olivia"];
  if (male.some((n) => name.includes(n))) score += 40;
  if (female.some((n) => name.includes(n))) score -= 40;

  // Desktop SAPI voices are the robotic ones we are trying to avoid.
  if (/desktop/.test(name)) score -= 35;

  return score;
}

function availableVoices() {
  if (!("speechSynthesis" in window)) return [];
  return (window.speechSynthesis.getVoices() || [])
    .filter((v) => (v.lang || "").toLowerCase().startsWith("en"))
    .map((v) => ({ voice: v, score: scoreVoice(v) }))
    .sort((a, b) => b.score - a.score);
}

function pickVoice() {
  const ranked = availableVoices();
  if (!ranked.length) return null;

  const saved = localStorage.getItem("jarvis.voice");
  if (saved) {
    const match = window.speechSynthesis.getVoices().find((v) => v.name === saved);
    if (match) return match;
  }
  return ranked[0].voice;
}

const PREVIEW_LINE =
  "Good evening, sir. The after-hours rate is two hundred and forty dollars an " +
  "hour, rising to two hundred and sixty on the first of October.";

/**
 * Read a sample so a voice can be judged before committing to it.
 *
 * With no voiceName, previews whatever is currently selected — which is what
 * the server-side voice rows do, since the browser has no handle on those.
 */
function previewVoice(voiceName, sample) {
  const line = sample || PREVIEW_LINE;

  if (state.ttsEngine === "neural" && state.status?.tts?.available) {
    // Reuse the main path so a preview is the real thing, cache and all.
    speakNeural(line);
    return;
  }

  if (!("speechSynthesis" in window)) return;
  const voices = window.speechSynthesis.getVoices();
  const voice = voiceName
    ? voices.find((v) => v.name === voiceName)
    : pickVoice();
  if (!voice && !voiceName) return;

  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(line);
  if (voice) utterance.voice = voice;
  utterance.rate = state.rate;
  // Edge's natural voices ignore pitch, and forcing it on SAPI voices is what
  // made JARVIS sound like a slowed-down newsreader. Leave it neutral.
  utterance.pitch = 1.0;
  window.speechSynthesis.speak(utterance);
}

/**
 * Say something, using the best engine available.
 *
 * Order of preference:
 *   1. Server-rendered neural audio (edge-tts) — the good voice, any browser.
 *   2. The browser's own synthesiser — instant, offline, but robotic here.
 *
 * A neural failure silently falls back rather than leaving the answer unspoken,
 * because a missing voice is a far worse outcome than an ugly one.
 */
async function speak(text) {
  if (!state.voice || !text) return;

  const clean = speakable(text);
  if (!clean) return;

  window.speechSynthesis?.cancel();
  state.speaking = true;
  setOrb("speaking");

  if (state.ttsEngine === "neural" && state.status?.tts?.available) {
    const ok = await speakNeural(clean);
    if (ok) return;
  }
  speakBrowser(clean);
}

/** Play server-rendered neural audio. Returns false so the caller can fall back. */
async function speakNeural(clean) {
  try {
    const response = await fetch("/api/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        text: clean,
        voice: state.neuralVoice,
        treatment: state.treatment,
        rate: rateToPercent(state.rate),
      }),
    });
    if (!response.ok) return false;

    const blob = await response.blob();
    if (!blob.size) return false;

    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);

    // Hold a reference: a garbage-collected Audio element stops mid-sentence.
    state.audio = audio;

    const finish = () => {
      URL.revokeObjectURL(url);
      state.audio = null;
      state.speaking = false;
      setOrb(state.listening ? "listening" : "");
      if (state.ear) startListening();
    };

    audio.onended = finish;
    audio.onerror = () => { finish(); speakBrowser(clean); };

    await audio.play();
    return true;
  } catch {
    return false;
  }
}

/** The browser's built-in voice — the fallback path. */
function speakBrowser(clean) {
  if (!("speechSynthesis" in window)) {
    state.speaking = false;
    setOrb(state.listening ? "listening" : "");
    return;
  }

  // Chunked, because Chrome mangles any single utterance over about 14 seconds.
  const sentences = clean.match(/[^.!?]+[.!?]*/g) || [clean];
  const groups = [];
  let current = "";
  for (const sentence of sentences) {
    if ((current + sentence).length > 180 && current) { groups.push(current); current = sentence; }
    else current += sentence;
  }
  if (current) groups.push(current);

  const voice = pickVoice();
  state.speaking = true;
  setOrb("speaking");

  groups.forEach((group, index) => {
    const utterance = new SpeechSynthesisUtterance(group.trim());
    if (voice) utterance.voice = voice;
    utterance.rate = state.rate;
    utterance.pitch = 1.0;
    if (index === groups.length - 1) {
      utterance.onend = () => {
        state.speaking = false;
        setOrb(state.listening ? "listening" : "");
        if (state.ear) startListening();
      };
      utterance.onerror = () => {
        state.speaking = false;
        setOrb(state.listening ? "listening" : "");
      };
    }
    window.speechSynthesis.speak(utterance);
  });
}

/** Map the 0.6–1.6 rate slider onto edge-tts's percentage form. */
function rateToPercent(rate) {
  const delta = Math.round((rate - 1) * 100);
  return `${delta >= 0 ? "+" : ""}${delta}%`;
}

function stopSpeaking() {
  window.speechSynthesis?.cancel();
  if (state.audio) {
    try { state.audio.pause(); } catch { /* already stopped */ }
    state.audio = null;
  }
  state.speaking = false;
  setOrb(state.listening ? "listening" : "");
}

/** Render the voice chooser: server voices when available, else browser ones. */
function renderVoices() {
  const tts = state.status?.tts;

  if (state.ttsEngine === "neural" && tts?.voices?.length) {
    el.voiceList.innerHTML = "";
    for (const v of tts.voices) {
      const row = document.createElement("button");
      row.className = "voicerow" + (v.id === state.neuralVoice ? " chosen" : "");
      row.type = "button";
      row.innerHTML =
        `<span class="vname">${escapeHtml(v.label)}</span>` +
        `<span class="vmeta">${escapeHtml(v.pitch)} · ${escapeHtml(v.rate)} · neural</span>`;
      row.title = v.note || "";
      row.addEventListener("click", () => {
        state.neuralVoice = v.id;
        try { localStorage.setItem("jarvis.neuralVoice", v.id); } catch { /* ignore */ }
        renderVoices();
        previewVoice(null);
      });
      el.voiceList.appendChild(row);
    }
    return;
  }

  renderBrowserVoices();
}

function renderBrowserVoices() {
  const ranked = availableVoices();
  const chosen = pickVoice();

  if (!ranked.length) {
    el.voiceList.innerHTML =
      "<div class='chip'>No English voices reported yet — press “Reload voices”." +
      " If it stays empty, this browser exposes none.</div>";
    return;
  }

  el.voiceList.innerHTML = "";
  // Show the plausible candidates; a long tail of low scorers is just noise.
  for (const { voice, score } of ranked.slice(0, 14)) {
    const row = document.createElement("button");
    row.className = "voicerow" + (chosen && voice.name === chosen.name ? " chosen" : "");
    row.type = "button";
    const tier = /natural|neural|online|premium|enhanced/i.test(voice.name)
      ? "neural" : "standard";
    row.innerHTML =
      `<span class="vname">${escapeHtml(voice.name)}</span>` +
      `<span class="vmeta">${escapeHtml(voice.lang)} · ${tier}</span>`;
    row.addEventListener("click", () => {
      localStorage.setItem("jarvis.voice", voice.name);
      renderVoices();
      previewVoice(voice.name);
    });
    el.voiceList.appendChild(row);
  }
}

// ---------------------------------------------------------------------------
// Listening — the "ear"
// ---------------------------------------------------------------------------

function speechSupported() {
  return "webkitSpeechRecognition" in window || "SpeechRecognition" in window;
}

function startListening() {
  if (!state.recognition || state.listening || state.speaking) return;
  try {
    state.recognition.start();
  } catch {
    /* already started — Chrome throws if start() is called twice */
  }
}

function stopListening() {
  if (!state.recognition) return;
  try { state.recognition.stop(); } catch { /* not running */ }
}

function buildRecognition() {
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition) return null;

  const recognition = new Recognition();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = "en-AU";

  recognition.onstart = () => {
    state.listening = true;
    el.ear.textContent = "Ear on";
    if (!state.speaking) setOrb("listening");
  };

  recognition.onend = () => {
    state.listening = false;
    if (!state.speaking) setOrb("");
    // Chrome stops recognition after silence; restart while the ear is on.
    if (state.ear && !state.busy) setTimeout(startListening, 320);
  };

  recognition.onerror = (event) => {
    // Chrome reports several quite different problems through this one event,
    // and the default (a silent no-op) leaves you guessing. Name each one.
    const messages = {
      "not-allowed":
        "Microphone access was blocked. Click the padlock in the address bar, " +
        "set Microphone to Allow, then reload the page.",
      "service-not-allowed":
        "Chrome refused speech recognition for this page. Load the shell at " +
        "http://127.0.0.1:4731 — not over a LAN address — and allow the mic.",
      "audio-capture":
        "No microphone was found. Check that one is plugged in and selected " +
        "in Windows sound settings.",
      "network":
        "Chrome's speech service is unreachable. In Chrome's speech recognition " +
        "this usually means its Google speech backend could not be reached — " +
        "check your connection or VPN, then reload. (You can still type to me.)",
      "aborted":
        "Recognition stopped.",
      "no-speech":
        "I didn't catch anything. Try again, a little closer to the mic.",
    };

    const message = messages[event.error];
    if (!message) return;

    // "no-speech" and "aborted" are routine while listening continuously; do
    // not spam the transcript with them.
    if (event.error === "no-speech" || event.error === "aborted") return;

    addTurn("jarvis", message, { error: true });

    // Anything fatal drops out of hands-free mode so the UI is not lying.
    if (event.error === "not-allowed" || event.error === "service-not-allowed" ||
        event.error === "audio-capture" || event.error === "network") {
      state.ear = false;
      el.ear.setAttribute("aria-pressed", "false");
      el.ear.textContent = "Ear off";
      setOrb("");
    }
  };

  recognition.onresult = (event) => {
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const result = event.results[i];
      if (!result.isFinal) {
        // Live preview only when hands-free, so it does not fight the composer.
        if (state.ear) el.input.value = result[0].transcript.trim();
        continue;
      }
      const said = result[0].transcript.trim();
      if (!said) continue;

      el.input.value = "";
      if (!state.ear) { submit(said); continue; }

      // Hands-free: only act on the wake word, then strip it.
      if (state.wake.test(said)) {
        const task = said.replace(WAKE_STRIP, "").trim();
        submit(task || "Yes sir?");
      }
    }
  };

  return recognition;
}

/**
 * Turn hands-free listening on or off.
 *
 * Returns true only when listening actually began. Every early exit reports why
 * in the transcript, because a toggle that silently refuses to move is the worst
 * possible failure: it looks like the app is broken and gives no next step.
 */
async function setEar(on) {
  if (!on) {
    state.ear = false;
    el.ear.setAttribute("aria-pressed", "false");
    el.ear.textContent = "Ear off";
    stopListening();
    setOrb("");
    return true;
  }

  // 1. Can this browser do speech recognition at all?
  if (!speechSupported()) {
    addTurn("jarvis",
      `This browser can't do speech recognition (${browserName()}), so the ear ` +
      "has nothing to listen with. Open http://127.0.0.1:4731 in Chrome or Edge " +
      "and the ear will work. You can type to me here in the meantime.",
      { error: true });
    return false;
  }

  // 2. Is there actually a microphone we are allowed to use?
  const mic = await requestMicrophone();
  if (!mic.ok) {
    addTurn("jarvis", mic.reason, { error: true });
    return false;
  }

  // 3. Build the recogniser if this is the first time.
  if (!state.recognition) {
    state.recognition = buildRecognition();
    if (!state.recognition) {
      addTurn("jarvis",
        "Speech recognition failed to start. Chrome or Edge will work, sir.",
        { error: true });
      return false;
    }
  }

  state.ear = true;
  el.ear.setAttribute("aria-pressed", "true");
  el.ear.textContent = "Ear on";
  addTurn("jarvis", "Listening, sir. Say “Jarvis” and I'll answer.");
  startListening();
  return true;
}

function browserName() {
  const ua = navigator.userAgent;
  if (/Edg\//.test(ua)) return "Edge";
  if (/OPR\//.test(ua)) return "Opera";
  if (/Firefox\//.test(ua)) return "Firefox";
  if (/Chrome\//.test(ua)) return "Chrome";
  if (/Safari\//.test(ua)) return "Safari";
  return "this browser";
}

// Browsers only expose the microphone on a secure origin. 127.0.0.1 and
// localhost qualify; a LAN address does not, and that failure is otherwise mute.
async function requestMicrophone() {
  if (!navigator.mediaDevices?.getUserMedia) {
    return {
      ok: false,
      reason: "This page can't reach a microphone. Browsers only allow that " +
              "on http://127.0.0.1 or https. If you opened this over a LAN " +
              "address, use 127.0.0.1 instead.",
    };
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    // Release the device at once; speech recognition opens its own capture.
    stream.getTracks().forEach((track) => track.stop());
    return { ok: true, reason: "" };
  } catch (error) {
    let reason;
    switch (error?.name) {
      case "NotAllowedError":
        reason = "The microphone is blocked. Click the padlock in the address " +
                 "bar, set Microphone to Allow, then reload the page.";
        break;
      case "NotFoundError":
      case "OverconstrainedError":
        reason = "No microphone was found. Plug one in, or set a default input " +
                 "device in Windows sound settings, then reload.";
        break;
      case "NotReadableError":
        reason = "The microphone is busy — another app is holding it. Close " +
                 "that app (Teams, Zoom, OBS) and try again.";
        break;
      case "SecurityError":
        reason = "The browser blocked audio capture for this origin. Load the " +
                 "shell at http://127.0.0.1:4731, or serve it over https.";
        break;
      default:
        reason = `I can't open a microphone (${error?.name || "unknown error"}).`;
    }
    return { ok: false, reason };
  }
}

// ---------------------------------------------------------------------------
// Submitting
// ---------------------------------------------------------------------------

async function submit(task) {
  if (state.busy || !task) return;
  state.busy = true;
  el.send.disabled = true;
  window.speechSynthesis?.cancel();

  addTurn("you", task);
  const bubble = addWorking();
  setOrb("working");

  try {
    const started = await api("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task, ground: true }),
    });
    if (!started.ok) throw new Error(started.error || "could not start the job");

    const job = await pollJob(started.job_id);
    bubble.remove();

    if (job.status === "done") {
      const meta = [];
      if (job.briefing_chars > 0) {
        meta.push([`grounded in your notes (${job.briefing_chars} chars)`, "grounded"]);
      } else {
        meta.push(["answered without memory"]);
      }
      meta.push([`${job.elapsed}s`]);
      addTurn("jarvis", job.answer || "(no answer)", { meta });
      speak(job.answer);
    } else {
      addTurn("jarvis", job.error || "The agent failed without saying why.", { error: true });
    }
  } catch (error) {
    bubble.remove();
    addTurn("jarvis", `Something went wrong: ${error.message}`, { error: true });
  } finally {
    state.busy = false;
    el.send.disabled = false;
    setOrb(state.speaking ? "speaking" : state.listening ? "listening" : "");
    el.input.focus();
  }
}

function pollJob(jobId) {
  return new Promise((resolve, reject) => {
    const started = Date.now();
    const tick = async () => {
      try {
        const data = await api(`/api/job/${jobId}`);
        const job = data.job;
        if (job.status === "working") {
          if (Date.now() - started > 900000) return reject(new Error("timed out"));
          state.poll = setTimeout(tick, 900);
          return;
        }
        state.poll = null;
        resolve(job);
      } catch (error) {
        state.poll = null;
        reject(error);
      }
    };
    tick();
  });
}

// Memory panel

async function rebuildIndex() {
  el.rebuild.disabled = true;
  el.memoryOut.textContent = "Rebuilding the index…";
  try {
    const result = await api("/api/memory/rebuild", { method: "POST" });
    el.memoryOut.textContent = result.ok
      ? (result.stdout || "Rebuilt.")
      : `Could not rebuild: ${result.error || result.stderr}`;
    await refreshStatus();
  } catch (error) {
    el.memoryOut.textContent = `Could not rebuild: ${error.message}`;
  } finally {
    el.rebuild.disabled = false;
  }
}

async function showStats() {
  el.showStats.disabled = true;
  el.memoryOut.textContent = "Reading the brain…";
  try {
    const result = await api("/api/memory/stats");
    el.memoryOut.textContent = result.ok
      ? (result.stdout || "No stats.")
      : `Could not read stats: ${result.error || result.stderr}`;
  } catch (error) {
    el.memoryOut.textContent = `Could not read stats: ${error.message}`;
  } finally {
    el.showStats.disabled = false;
  }
}

// One-click capability report. Every voice problem this shell can have is one
// of these facts, so printing them removes the guesswork from "the ear won't
// turn on".
async function diagnose() {
  el.diagnose.disabled = true;
  el.memoryOut.textContent = "Checking capabilities…";

  const lines = [];
  const tick = (ok, label, detail) =>
    lines.push(`${ok ? "PASS" : "FAIL"}  ${label.padEnd(26)} ${detail}`);

  lines.push(`JARVIS voice shell — capability report`);
  lines.push(`browser      ${browserName()}`);
  lines.push(`page origin  ${location.origin}`);
  lines.push(`user agent   ${navigator.userAgent}`);
  lines.push("");

  const secure = window.isSecureContext !== false;
  tick(secure, "secure context", secure
    ? "yes (microphone is permitted here)"
    : "NO — load http://127.0.0.1:4731 instead of a LAN address");

  const rec = speechSupported();
  tick(rec, "speech recognition",
    rec ? "available" : `unavailable in ${browserName()} — use Chrome or Edge`);

  const tts = "speechSynthesis" in window;
  tick(tts, "speech synthesis", tts ? "available" : "unavailable");

  const neural = state.status?.tts?.available;
  tick(!!neural, "neural voice (edge-tts)", neural
    ? `installed — using ${state.neuralVoice}`
    : "not installed — run: pip install edge-tts");

  const media = !!navigator.mediaDevices?.getUserMedia;
  tick(media, "microphone API", media ? "available" : "unavailable");

  if (media) {
    const mic = await requestMicrophone();
    tick(mic.ok, "microphone permission",
      mic.ok ? "granted and the device opens" : mic.reason);
  }

  // Server side.
  try {
    const s = await api("/api/status");
    tick(s.runner.dsh, "harness launcher", s.runner.dsh ? "found" : "NOT FOUND");
    tick(s.runner.brain, "brain.py", s.runner.brain ? "found" : "NOT FOUND");
    tick(s.brain.configured, "memory vault",
      s.brain.configured ? s.brain.vault : "JARVIS_VAULT not set");
    tick(s.brain.indexed, "memory index", s.brain.indexed
      ? `${s.brain.notes} notes, built ${String(s.brain.built).slice(0, 19)}`
      : "not built — press Rebuild index");
  } catch (error) {
    tick(false, "server", `unreachable: ${error.message}`);
  }

  lines.push("");
  lines.push("If speech recognition FAILS, typing still works — the memory and");
  lines.push("the agent are independent of the microphone.");

  el.memoryOut.textContent = lines.join("\n");
  el.diagnose.disabled = false;
}

/** Explain where this browser's voices come from, and why it matters. */
function renderEngineBar() {
  const neuralReady = !!state.status?.tts?.available;
  el.engineBar.innerHTML = "";

  const mk = (engine, label, enabled, title) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = label;
    button.disabled = !enabled;
    button.title = title;
    button.setAttribute("aria-pressed", String(state.ttsEngine === engine));
    button.addEventListener("click", () => {
      state.ttsEngine = engine;
      try { localStorage.setItem("jarvis.ttsEngine", engine); } catch { /* ignore */ }
      stopSpeaking();
      describeVoiceSupport();
      renderEngineBar();
      renderTreatedBar();
      renderVoices();
    });
    el.engineBar.appendChild(button);
  };

  mk("neural", "Neural (edge-tts)", neuralReady,
     neuralReady ? "Server-rendered neural voice — best quality, any browser"
                 : "Install with: pip install edge-tts");
  mk("browser", "Browser voices", true,
     "Instant and offline, but robotic on Windows outside Edge");
}

function renderTreatedBar() {
  const tts = state.status?.tts;
  el.treatedBar.innerHTML = "";

  // The treatment is post-processing on the neural render, so it is meaningless
  // in browser mode.
  if (state.ttsEngine !== "neural" || !tts?.available) return;

  const label = document.createElement("span");
  label.className = "tlabel";
  label.textContent = "Sound";
  el.treatedBar.appendChild(label);

  for (const t of (tts.treatments || [])) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = t.label;
    button.disabled = !t.active;
    button.setAttribute("aria-pressed", String(state.treatment === t.id));
    button.title = t.active
      ? "Play a sample to hear this treatment"
      : "Needs ffmpeg on PATH";
    button.addEventListener("click", () => {
      state.treatment = t.id;
      try { localStorage.setItem("jarvis.treatment", t.id); } catch { /* ignore */ }
      renderTreatedBar();
      previewVoice(null);
    });
    el.treatedBar.appendChild(button);
  }
}

function describeVoiceSupport() {
  const all = ("speechSynthesis" in window) ? window.speechSynthesis.getVoices() : [];
  const english = availableVoices();
  const neuralCount = english.filter(({ voice }) =>
    /natural|neural|online|premium|enhanced/i.test(voice.name || "")).length;

  const lines = [];

  if (state.ttsEngine === "neural" && state.status?.tts?.available) {
    const label = (state.status.tts.voices || [])
      .find((v) => v.id === state.neuralVoice)?.label || state.neuralVoice;
    const treatment = (state.status.tts.treatments || [])
      .find((t) => t.id === state.treatment)?.label || state.treatment;
    lines.push(`Neural speech is on: ${label}, sound “${treatment}”. It is ` +
               "rendered by the server, so it sounds the same in every browser — " +
               "and it supports pitch, which Edge's own neural voices ignore.");
    lines.push("Pick a voice or a sound below, then press Test voice.");
  } else if (state.ttsEngine === "neural") {
    lines.push("Neural speech is not installed. Run: pip install edge-tts, then " +
               "restart the server. Until then you get the browser's own voices, " +
               "which on Windows are the robotic ones.");
  } else {
    lines.push(`${all.length} voice${all.length === 1 ? "" : "s"} exposed by this ` +
               `browser, ${english.length} in English` +
               (neuralCount ? `, ${neuralCount} of them neural.` : "."));
    if (!all.length) {
      lines.push("Nothing yet — Chrome fills this list in a moment after load. " +
                 "Press “Reload voices”.");
    } else if (!neuralCount) {
      // The single biggest factor in whether JARVIS sounds human.
      lines.push(browserName() === "Edge"
        ? "No neural voices are listed; Edge normally offers 250+. Try reloading."
        : `Windows' good neural voices are only exposed to Edge, not ` +
          `${browserName()}. Either switch to the Neural engine above, or open ` +
          "this page in Edge.");
    }
    const chosen = pickVoice();
    if (chosen) lines.push(`Selected: ${chosen.name} (${chosen.lang})`);
  }

  el.voiceHint.textContent = lines.join(" ");
}

// ---------------------------------------------------------------------------
// Wiring
// ---------------------------------------------------------------------------

el.ear.addEventListener("click", async () => {
  // A refusal now leaves the ear visibly off with an explanation, so a failed
  // attempt is never a no-op the user has to interpret.
  const on = !state.ear;
  if (on) {
    el.ear.setAttribute("aria-pressed", "true");
    el.ear.textContent = "Ear on";
  }
  const started = await setEar(on);
  if (!started) {
    el.ear.setAttribute("aria-pressed", "false");
    el.ear.textContent = "Ear off";
  }
});

el.voice.addEventListener("click", () => {
  state.voice = !state.voice;
  el.voice.setAttribute("aria-pressed", String(state.voice));
  el.voice.textContent = state.voice ? "Voice on" : "Voice off";
  if (!state.voice) stopSpeaking();
  try { localStorage.setItem("jarvis.voiceOn", state.voice ? "1" : "0"); } catch { /* ignore */ }
});

el.memoryBtn.addEventListener("click", () => {
  const open = el.memory.classList.toggle("open");
  el.memoryBtn.setAttribute("aria-pressed", String(open));
  // The two drawers share the same space; only one open at a time.
  if (open) {
    el.voicePanel.classList.remove("open");
    el.voiceBtn.setAttribute("aria-pressed", "false");
    refreshStatus();
  }
});

el.voiceBtn.addEventListener("click", () => {
  const open = el.voicePanel.classList.toggle("open");
  el.voiceBtn.setAttribute("aria-pressed", String(open));
  if (open) {
    el.memory.classList.remove("open");
    el.memoryBtn.setAttribute("aria-pressed", "false");
    renderEngineBar();
    renderTreatedBar();
    describeVoiceSupport();
    renderVoices();
  }
});

el.reloadVoices.addEventListener("click", () => {
  // Chrome populates the voice list asynchronously and can return [] on the
  // first call, which is why this button exists at all.
  if ("speechSynthesis" in window) window.speechSynthesis.getVoices();
  describeVoiceSupport();
  renderVoices();
});

el.testVoice.addEventListener("click", () => {
  if (state.ttsEngine === "neural") {
    if (!state.status?.tts?.available) {
      el.voiceHint.textContent =
        "Neural speech needs edge-tts: run “pip install edge-tts”, then restart " +
        "the server. Or switch to Browser voices above.";
      return;
    }
    previewVoice(null);
    return;
  }

  const chosen = pickVoice();
  if (!chosen) {
    el.voiceHint.textContent =
      "No voices are available in this browser, so there is nothing to test.";
    return;
  }
  previewVoice(chosen.name);
});

el.rate.addEventListener("input", () => {
  state.rate = parseFloat(el.rate.value);
  el.rateOut.textContent = state.rate.toFixed(2);
  try { localStorage.setItem("jarvis.rate", String(state.rate)); } catch { /* ignore */ }
});

el.rebuild.addEventListener("click", rebuildIndex);
el.showStats.addEventListener("click", showStats);
el.diagnose.addEventListener("click", diagnose);

el.send.addEventListener("click", () => {
  const task = el.input.value.trim();
  if (task) { el.input.value = ""; submit(task); }
});

el.input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    el.send.click();
  }
});

// Space on a focused toggle button would re-trigger it; leave that alone, but
// stop the orb keys from reaching the textarea.
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && state.busy) {
    if (state.poll) { clearTimeout(state.poll); state.poll = null; }
    state.busy = false;
    el.send.disabled = false;
    setOrb("");
    addTurn("jarvis", "Stopped waiting, sir. The agent may still be working.", { error: true });
  }
});

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------

(async function boot() {
  await refreshStatus();
  setInterval(refreshStatus, 30000);

  const s = state.status;
  if (s && !s.runner.dsh) {
    addTurn("jarvis",
      "I can't find the DeepSeek Harness, sir. Set DSH_BIN to " +
      "@deepseek-ai/dsh/lib/bin.js and restart the server.", { error: true });
  } else if (s && !s.brain.configured) {
    addTurn("jarvis",
      "No memory vault is configured, so I'll be answering blind. " +
      "Set JARVIS_VAULT to your notes folder and restart the server.");
  } else if (s && !s.brain.indexed) {
    addTurn("jarvis",
      "Your memory vault is set but not indexed yet. Open Memory and hit " +
      "Rebuild index, sir.");
  } else {
    addTurn("jarvis", "At your service, sir. What are we building today?");
  }

  // Do NOT disable the ear when speech is unsupported. A disabled button is a
  // dead end: it cannot be clicked and cannot explain itself. Leave it live so
  // clicking it produces an error message naming the browser and the fix.
  if (!speechSupported()) {
    el.ear.title = `No speech recognition in ${browserName()} — click for details`;
    el.ear.classList.add("unsupported");
    if (window.isSecureContext === false) {
      addTurn("jarvis",
        "This page is not on a secure origin, so the browser will refuse the " +
        "microphone. Open http://127.0.0.1:4731 rather than a network address.",
        { error: true });
    }
  }

  el.rate.value = String(state.rate);
  el.rateOut.textContent = state.rate.toFixed(2);

  renderEngineBar();
  renderTreatedBar();
  describeVoiceSupport();
  renderVoices();

  if ("speechSynthesis" in window) {
    // The voice list arrives asynchronously in Chrome and is empty on the first
    // call, so re-render on the event rather than only when the panel opens.
    const fillVoices = () => {
      if (state.ttsEngine === "browser") { describeVoiceSupport(); renderVoices(); }
    };
    window.speechSynthesis.addEventListener?.("voiceschanged", fillVoices);
  }

  el.input.focus();
})();
</script>
</body>
</html>
